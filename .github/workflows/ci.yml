---
name: Build and Release

on:
  push:
    tags: [v*]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build and update metadata
        run: make ci
      - name: Commit and push
        run: |
          git config user.name "Catppuccin Bot"
          git config user.email "bot@catppuccin.com"
          git add packages.json repository.json
          git commit -m "chore: update PCM metadata for ${{ github.ref_name }}" || true
          git push origin main
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: catppuccin-kicad-v${{ github.ref_name }}.zip
          target_commitish: main
