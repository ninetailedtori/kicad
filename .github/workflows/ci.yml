---
name: Build and Release

on:
  push:
    branches: [main, next]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@taplo
      - name: Get version
        id: version
        run: |
          VERSION=$(taplo get pyproject.toml -k package.version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Whiskers
        uses: catppuccin/setup-whiskers@v2
      - name: Build and update metadata
        run: make ci
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata.json packages.json repository.json
          git commit -m "chore: update PCM metadata for v${{ steps.version.outputs.version }}" || true
          git push origin main
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: catppuccin-kicad-v${{ steps.version.outputs.version }}.zip
          tag_name: v${{ steps.version.outputs.version }}
